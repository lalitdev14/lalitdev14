<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1d2b3a" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#fbbf24"/>
    </marker>
    <style>
      .lbl{fill:#6b7f95;font-size:12px;letter-spacing:2px}
      .hi{fill:#fbbf24}
      .ok{fill:#5eead4}
      .ink{fill:none;stroke:#93c5fd;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .line{stroke:#3b4b5e;stroke-width:3;stroke-linecap:round}
      .write{stroke-dasharray:260;animation:write 5s ease-in-out infinite}
      @keyframes write{0%{stroke-dashoffset:260}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
      .n1{animation:feed 5s ease-in-out infinite}
      .n2{animation:feed 5s ease-in-out infinite 2.5s}
      @keyframes feed{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(200px,0);opacity:1}62%,100%{transform:translate(200px,0);opacity:0}}
      .spin{transform-origin:600px 148px;animation:spin 6s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .check{stroke-dasharray:20;animation:check 5s ease-out infinite}
      .c2{animation-delay:.5s}.c3{animation-delay:1s}
      @keyframes check{0%,45%{stroke-dashoffset:20}60%,100%{stroke-dashoffset:0}}
      .dot{animation:blink 1.2s steps(2) infinite}
      @keyframes blink{50%{opacity:0}}
      .tick{animation:march 4s linear infinite}
      @keyframes march{to{stroke-dashoffset:-96}}
    </style>
    <clipPath id="frame"><rect x="2" y="2" width="1196" height="296" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0a121b"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <text x="28" y="36" class="lbl">SEMESTER <tspan class="hi">CSE</tspan> / <tspan class="hi">LECTURELOOP</tspan></text>
    <text x="1172" y="36" class="lbl" text-anchor="end">CLASS IN SESSION <tspan class="ok dot">●</tspan></text>

    <!-- inputs: notebook + slide -->
    <g transform="translate(80,74)">
      <rect width="120" height="150" rx="8" fill="#0f1a26" stroke="#93c5fd" stroke-width="2"/>
      <path d="M22 0v150" stroke="#f87171" stroke-opacity=".6" stroke-width="2"/>
      <path class="line" d="M32 30h74M32 54h74M32 78h74M32 102h74M32 126h74" stroke="#1f2f40"/>
      <path class="ink write" d="M34 26c8-10 14 8 22-2s12 8 20-2 10 6 24 0M34 50c10-8 16 6 26-2s14 6 30 0M34 74c6-6 12 4 20-1s10 6 22 0M34 98c10-8 18 8 28-2"/>
      <text x="60" y="170" font-size="11" fill="#6b7f95" text-anchor="middle">my notes</text>
    </g>
    <g transform="translate(225,94)">
      <rect width="120" height="80" rx="6" fill="#0f1a26" stroke="#a78bfa" stroke-width="2"/>
      <rect x="12" y="12" width="60" height="8" rx="2" fill="#a78bfa"/>
      <path class="line" d="M12 34h96M12 48h70M12 62h84"/>
      <text x="60" y="100" font-size="11" fill="#6b7f95" text-anchor="middle">lecture slides</text>
    </g>

    <!-- flying pages into the loop -->
    <g class="n1"><rect x="362" y="130" width="28" height="36" rx="3" fill="#0f1a26" stroke="#93c5fd" stroke-width="2"/></g>
    <g class="n2"><rect x="362" y="130" width="28" height="36" rx="3" fill="#0f1a26" stroke="#a78bfa" stroke-width="2"/></g>

    <!-- the loop -->
    <circle cx="600" cy="148" r="78" fill="#0f1a26" stroke="#2c3e52" stroke-width="2"/>
    <g class="spin">
      <path d="M600 82a66 66 0 0 1 64 50" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
      <path d="M600 214a66 66 0 0 1 -64 -50" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    </g>
    <text x="600" y="142" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="700">AI</text>
    <text x="600" y="162" font-size="11" fill="#fbbf24" text-anchor="middle">summarize()<tspan class="dot"> ▌</tspan></text>

    <!-- output: study summary -->
    <g transform="translate(880,66)">
      <rect width="220" height="164" rx="12" fill="#0f1a26" stroke="#5eead4" stroke-width="2.5"/>
      <rect x="16" y="16" width="112" height="18" rx="4" fill="#5eead4"/>
      <text x="72" y="29" font-size="10" fill="#0a121b" text-anchor="middle" font-weight="700">STUDY SUMMARY</text>
      <g fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="16" y="52" width="16" height="16" rx="3" stroke="#3b4b5e"/><path class="check" d="M19 60l4 4 7-8"/>
        <rect x="16" y="84" width="16" height="16" rx="3" stroke="#3b4b5e"/><path class="check c2" d="M19 92l4 4 7-8"/>
        <rect x="16" y="116" width="16" height="16" rx="3" stroke="#3b4b5e"/><path class="check c3" d="M19 124l4 4 7-8"/>
      </g>
      <text x="44" y="65" font-size="12" fill="#cbd5e1">key concepts</text>
      <text x="44" y="97" font-size="12" fill="#cbd5e1">definitions</text>
      <text x="44" y="129" font-size="12" fill="#cbd5e1">exam-ready recap</text>
      <rect x="44" y="140" width="96" height="6" rx="3" fill="#fbbf24" fill-opacity=".35"/>
    </g>

    <path d="M0 252H1200" stroke="#2c3e52" stroke-width="2" stroke-dasharray="14 10" class="tick"/>
    <g fill="none" stroke="#fbbf24" stroke-width="2">
      <rect x="292" y="246" width="12" height="12" transform="rotate(45 298 252)"/>
      <rect x="594" y="246" width="12" height="12" transform="rotate(45 600 252)"/>
      <rect x="984" y="246" width="12" height="12" transform="rotate(45 990 252)"/>
    </g>

    <text x="28" y="282" class="lbl">NOTES • SLIDES • AI • SUPABASE • TANSTACK START</text>
    <text x="1172" y="282" class="lbl" text-anchor="end">STATUS: <tspan class="ok">LIVE AT LECTURELOOP.ORG</tspan></text>
  </g>
  <rect x="2" y="2" width="1196" height="296" rx="22" fill="none" stroke="#fbbf24" stroke-opacity=".5" stroke-width="3"/>
</svg>
